[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP042", "UP045", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E741", "B011", "B018", "B017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
