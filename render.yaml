# Render Blueprint: free web service for the FastAPI backend (no card needed).
# Free services sleep after ~15 idle minutes and wake in ~1 minute; local files are lost on each spin-down.
services:
  - type: web
    name: chainaudit-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EXTRACTION_CONCURRENCY
        value: "1"
      - key: LLM_MAX_RETRIES
        value: "3"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
